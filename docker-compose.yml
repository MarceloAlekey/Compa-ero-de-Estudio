version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: syslab_db
    restart: always
    environment:
      POSTGRES_USER: sysadmin
      POSTGRES_PASSWORD: sysadmin_pass
      POSTGRES_DB: syslab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: syslab_backend
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: syslab_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  postgres_data:
