<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compañero de Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F1F4F9; --hoja:#FFFFFF; --tinta:#14213D; --suave:#5B6785;
  --linea:#D9E0EC; --azul:#2D5BFF; --marca:#FFE45E; --rojo:#E5484D;
  --verde:#178A5C; --ambar:#9A6412;
}
*{box-sizing:border-box}
body{
  margin:0; font:16px/1.55 'IBM Plex Sans',system-ui,sans-serif; color:var(--tinta);
  background-color:var(--papel);
  background-image:
    linear-gradient(rgba(45,91,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(45,91,255,.08) 1px,transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif; line-height:1.15; margin:0}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--azul); outline-offset:2px}
.suave,.meta{color:var(--suave)}
.meta{font-size:.875rem}

.app{display:grid; grid-template-columns:290px 1fr; gap:24px; max-width:1100px; margin:0 auto; padding:24px}
.lateral h1{font-size:1.7rem; margin-bottom:.4rem}
.lateral p{margin:0 0 1rem}

.materia-btn{
  display:block; width:100%; text-align:left; background:var(--hoja);
  border:1px solid var(--linea); border-left:4px solid transparent; border-radius:8px;
  padding:.7rem .9rem; margin-top:.5rem; cursor:pointer;
}
.materia-btn[aria-current="true"]{border-left-color:var(--azul); box-shadow:0 2px 0 var(--linea)}
.barra{height:6px; background:var(--linea); border-radius:99px; margin-top:.5rem; overflow:hidden}
.barra i{display:block; height:100%; background:var(--verde)}

.nueva{margin-top:1rem; background:var(--hoja); border:1px solid var(--linea); border-radius:8px; padding:.7rem .9rem}
.nueva summary{cursor:pointer; font-weight:500}
.nueva form{display:grid; gap:.5rem; margin-top:.8rem}

input,select{padding:.5rem .7rem; border:1px solid var(--linea); border-radius:8px; background:#fff}
.btn{background:var(--tinta); color:#fff; border:0; border-radius:8px; padding:.55rem 1rem; cursor:pointer; font-weight:500}
.btn:hover{background:#22345f}
.peligro{background:none; border:0; color:var(--rojo); cursor:pointer; text-decoration:underline; padding:.2rem}

.hoja{
  position:relative; background:var(--hoja); border:1px solid var(--linea); border-radius:10px;
  padding:28px 28px 32px 68px; min-height:540px;
}
.hoja::before{content:""; position:absolute; left:46px; top:0; bottom:0; width:2px; background:rgba(229,72,77,.55)}
.cabecera{display:flex; justify-content:space-between; align-items:flex-start; gap:1rem}
.cabecera h2{font-size:2.1rem}

.cuenta{display:flex; align-items:baseline; gap:.9rem; margin:1.4rem 0 2rem; flex-wrap:wrap}
.cuenta b{
  font:700 4.2rem/1 'Bricolage Grotesque',system-ui,sans-serif; padding:0 .35rem;
  background:linear-gradient(transparent 55%,var(--marca) 55%);
}
.cuenta span{font-size:1.1rem; color:var(--suave)}

.seccion{margin-top:1.8rem}
.seccion h3{font-size:1.35rem; display:flex; justify-content:space-between; align-items:baseline; gap:1rem}
.seccion h3 .meta{font:400 .9rem 'IBM Plex Sans',system-ui,sans-serif}

.tema,.examen{
  display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:.9rem;
  padding:.65rem 0; border-bottom:1px dashed var(--linea);
}
.examen{grid-template-columns:1fr auto auto}
.est{
  width:28px; height:28px; border-radius:50%; border:2px solid var(--suave); background:#fff;
  cursor:pointer; display:grid; place-items:center; padding:0; font-weight:700; line-height:1;
}
.est[data-e="EN_PROGRESO"]{border-color:var(--azul); background:linear-gradient(90deg,var(--azul) 50%,#fff 50%)}
.est[data-e="DOMINADO"]{border-color:var(--verde); background:var(--verde); color:#fff}
.tema.hecho .tit{color:var(--suave); text-decoration:line-through}
.dif{font-size:.875rem; white-space:nowrap}
.dif::before{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:.4rem; background:currentColor}
.dif.BAJA{color:var(--verde)} .dif.MEDIA{color:var(--ambar)} .dif.ALTA{color:var(--rojo)}
.vacio{padding:.8rem 0; color:var(--suave)}

.fila-form{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1rem}
.fila-form input[type="text"]{flex:1 1 200px}

.aviso{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--tinta); color:#fff;
  padding:.6rem 1rem; border-radius:8px; opacity:0; pointer-events:none; transition:opacity .2s;
}
.aviso.ver{opacity:1}
.aviso.error{background:var(--rojo)}

@media (max-width:820px){
  .app{grid-template-columns:1fr; padding:14px}
  .hoja{padding:22px 18px 26px 44px}
  .hoja::before{left:28px}
  .cabecera h2{font-size:1.7rem}
  .cuenta b{font-size:3.4rem}
  .tema{grid-template-columns:auto 1fr auto}
  .tema .dif{grid-column:2}
}
</style>
</head>
<body>
<div class="app">
  <aside class="lateral">
    <h1>Compañero de Estudio</h1>
    <p class="suave">Tus materias, temas y exámenes en un solo lugar.</p>
    <div id="lista"></div>
    <details class="nueva">
      <summary>Nueva materia</summary>
      <form id="form-materia">
        <input id="m-nombre" type="text" placeholder="Nombre de la materia" required maxlength="80" aria-label="Nombre de la materia">
        <input id="m-docente" type="text" placeholder="Docente (opcional)" maxlength="80" aria-label="Docente">
        <button class="btn" type="submit">Crear materia</button>
      </form>
    </details>
  </aside>
  <main class="hoja" id="hoja"><p class="suave">Cargando…</p></main>
</div>
<div id="aviso" class="aviso" role="status"></div>

<script>
const API = '__API_URL__';
const ESTADOS = ['PENDIENTE', 'EN_PROGRESO', 'DOMINADO'];
const ETIQUETA = { PENDIENTE: 'Pendiente', EN_PROGRESO: 'Estudiando', DOMINADO: 'Dominado' };
const DIFICULTAD = { BAJA: 'Dificultad baja', MEDIA: 'Dificultad media', ALTA: 'Dificultad alta' };

const $ = (s) => document.querySelector(s);
let materias = [];
let sel = null;

// Crea elementos del DOM de forma segura (sin innerHTML)
function h(tag, props = {}, ...hijos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of hijos.flat()) {
    if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  }
  return el;
}

let temporizador;
function aviso(txt, error = false) {
  const a = $('#aviso');
  a.textContent = txt;
  a.className = 'aviso ver' + (error ? ' error' : '');
  clearTimeout(temporizador);
  temporizador = setTimeout(() => a.classList.remove('ver'), 2600);
}

async function api(ruta, metodo = 'GET', cuerpo) {
  const r = await fetch(API + ruta, {
    method: metodo,
    headers: cuerpo ? { 'Content-Type': 'application/json' } : {},
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  if (r.status === 204) return null;
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : null;
  if (!r.ok) throw new Error((data && data.error) || 'Error del servidor');
  return data;
}

async function cargar() {
  try {
    materias = await api('/api/materias');
  } catch (e) {
    $('#hoja').replaceChildren(
      h('h2', {}, 'No se pudo conectar con el servidor'),
      h('p', { class: 'suave' }, `Verifica que el contenedor syslab_backend esté activo en ${API}.`)
    );
    return;
  }
  if (!materias.some((m) => m.id === sel)) sel = materias.length ? materias[0].id : null;
  pintar();
}

async function hacer(fn, mensaje) {
  try {
    await fn();
    await cargar();
    if (mensaje) aviso(mensaje);
  } catch (e) {
    aviso(e.message, true);
  }
}

function diasHasta(iso) {
  const f = new Date(iso);
  const hoy = new Date();
  const a = Date.UTC(f.getUTCFullYear(), f.getUTCMonth(), f.getUTCDate());
  const b = Date.UTC(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  return Math.round((a - b) / 86400000);
}
const fechaLarga = (iso) =>
  new Date(iso).toLocaleDateString('es-BO', { timeZone: 'UTC', day: 'numeric', month: 'long', year: 'numeric' });

function progreso(m) {
  const hechos = m.temas.filter((t) => t.estado === 'DOMINADO').length;
  return { hechos, total: m.temas.length, pct: m.temas.length ? Math.round((hechos / m.temas.length) * 100) : 0 };
}

function pintarLateral() {
  $('#lista').replaceChildren(
    ...materias.map((m) => {
      const p = progreso(m);
      return h('button', {
          class: 'materia-btn',
          'aria-current': String(m.id === sel),
          onclick: () => { sel = m.id; pintar(); },
        },
        h('strong', {}, m.nombre),
        h('div', { class: 'meta' }, `${p.hechos} de ${p.total} temas dominados`),
        h('div', { class: 'barra' }, h('i', { style: `width:${p.pct}%` }))
      );
    })
  );
  if (!materias.length) $('.nueva').open = true;
}

function filaTema(t) {
  const siguiente = ESTADOS[(ESTADOS.indexOf(t.estado) + 1) % ESTADOS.length];
  return h('div', { class: 'tema' + (t.estado === 'DOMINADO' ? ' hecho' : '') },
    h('button', {
      class: 'est', 'data-e': t.estado, title: ETIQUETA[t.estado],
      'aria-label': `${t.titulo}: ${ETIQUETA[t.estado]}. Cambiar a ${ETIQUETA[siguiente]}`,
      onclick: () => hacer(() => api(`/api/temas/${t.id}`, 'PATCH', { estado: siguiente })),
    }, t.estado === 'DOMINADO' ? '✓' : null),
    h('div', {}, h('div', { class: 'tit' }, t.titulo), h('div', { class: 'meta' }, ETIQUETA[t.estado])),
    h('span', { class: 'dif ' + t.dificultad }, DIFICULTAD[t.dificultad]),
    h('button', {
      class: 'peligro', 'aria-label': `Eliminar tema ${t.titulo}`,
      onclick: () => { if (confirm('¿Eliminar este tema?')) hacer(() => api(`/api/temas/${t.id}`, 'DELETE'), 'Tema eliminado'); },
    }, 'Eliminar')
  );
}

function filaExamen(e) {
  const d = diasHasta(e.fecha);
  const cuando = d === 0 ? 'es hoy' : d > 0 ? `en ${d} ${d === 1 ? 'día' : 'días'}` : `hace ${-d} ${d === -1 ? 'día' : 'días'}`;
  return h('div', { class: 'examen' },
    h('div', {}, h('div', {}, e.titulo), h('div', { class: 'meta' }, fechaLarga(e.fecha))),
    h('span', { class: 'meta' }, cuando),
    h('button', {
      class: 'peligro', 'aria-label': `Eliminar examen ${e.titulo}`,
      onclick: () => { if (confirm('¿Eliminar este examen?')) hacer(() => api(`/api/examenes/${e.id}`, 'DELETE'), 'Examen eliminado'); },
    }, 'Eliminar')
  );
}

function pintarHoja() {
  const hoja = $('#hoja');
  const m = materias.find((x) => x.id === sel);
  if (!m) {
    hoja.replaceChildren(
      h('h2', {}, 'Aún no tienes materias'),
      h('p', { class: 'suave' }, 'Crea la primera con "Nueva materia" en el panel izquierdo.')
    );
    return;
  }

  const p = progreso(m);
  const prox = m.examenes
    .map((e) => ({ e, d: diasHasta(e.fecha) }))
    .filter((x) => x.d >= 0)
    .sort((a, b) => a.d - b.d)[0];

  let cuenta;
  if (!prox) cuenta = h('p', { class: 'suave' }, 'No hay exámenes próximos. Agrega uno más abajo.');
  else if (prox.d === 0) cuenta = h('div', { class: 'cuenta' }, h('b', {}, 'Hoy'), h('span', {}, prox.e.titulo));
  else cuenta = h('div', { class: 'cuenta' }, h('b', {}, prox.d), h('span', {}, `${prox.d === 1 ? 'día' : 'días'} para ${prox.e.titulo}`));

  // Formulario de temas
  const inTema = h('input', { type: 'text', placeholder: 'Título del tema', required: 'true', maxlength: '120', 'aria-label': 'Título del tema' });
  const selDif = h('select', { 'aria-label': 'Dificultad' },
    h('option', { value: 'BAJA' }, 'Dificultad baja'),
    h('option', { value: 'MEDIA', selected: 'true' }, 'Dificultad media'),
    h('option', { value: 'ALTA' }, 'Dificultad alta'));
  const formTema = h('form', {
    class: 'fila-form',
    onsubmit: (ev) => {
      ev.preventDefault();
      hacer(() => api(`/api/materias/${m.id}/temas`, 'POST', { titulo: inTema.value, dificultad: selDif.value }), 'Tema agregado');
    },
  }, inTema, selDif, h('button', { class: 'btn', type: 'submit' }, 'Agregar tema'));

  // Formulario de exámenes
  const inExamen = h('input', { type: 'text', placeholder: 'Título del examen', required: 'true', maxlength: '120', 'aria-label': 'Título del examen' });
  const inFecha = h('input', { type: 'date', required: 'true', 'aria-label': 'Fecha del examen' });
  const formExamen = h('form', {
    class: 'fila-form',
    onsubmit: (ev) => {
      ev.preventDefault();
      hacer(() => api(`/api/materias/${m.id}/examenes`, 'POST', { titulo: inExamen.value, fecha: inFecha.value }), 'Examen agregado');
    },
  }, inExamen, inFecha, h('button', { class: 'btn', type: 'submit' }, 'Agregar examen'));

  hoja.replaceChildren(
    h('div', { class: 'cabecera' },
      h('div', {}, h('h2', {}, m.nombre), m.docente ? h('div', { class: 'suave' }, m.docente) : null),
      h('button', {
        class: 'peligro',
        onclick: () => { if (confirm('¿Eliminar la materia con todos sus temas y exámenes?')) hacer(() => api(`/api/materias/${m.id}`, 'DELETE'), 'Materia eliminada'); },
      }, 'Eliminar materia')
    ),
    cuenta,
    h('section', { class: 'seccion' },
      h('h3', {}, 'Temas', h('span', { class: 'meta' }, `${p.hechos} de ${p.total} dominados`)),
      h('div', { class: 'barra' }, h('i', { style: `width:${p.pct}%` })),
      m.temas.length ? m.temas.map(filaTema) : h('p', { class: 'vacio' }, 'Sin temas todavía. Agrega el primero abajo.'),
      formTema),
    h('section', { class: 'seccion' },
      h('h3', {}, 'Exámenes'),
      m.examenes.length ? m.examenes.map(filaExamen) : h('p', { class: 'vacio' }, 'Sin exámenes registrados.'),
      formExamen)
  );
}

function pintar() { pintarLateral(); pintarHoja(); }

$('#form-materia').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const form = ev.target;
  hacer(async () => {
    const nueva = await api('/api/materias', 'POST', { nombre: $('#m-nombre').value, docente: $('#m-docente').value });
    sel = nueva.id;
    form.reset();
  }, 'Materia creada');
});

cargar();
</script>
</body>
</html>
